<!doctype html>
<html><head><meta charset="utf-8"><title>img2prop 道具详情</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1c1b20; color: #ddd; font: 13px/1.5 system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; gap: 14px; align-items: center; padding: 8px 14px; background: #141317; flex-wrap: wrap; }
  header a { color: #e8c878; text-decoration: none; }
  header b { color: #e8c878; font-size: 15px; }
  header label { display: flex; gap: 6px; align-items: center; }
  .hint { color: #888; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; overflow: hidden; }
  #picked { position: absolute; left: 10px; bottom: 8px; color: #e8c878; font: 12px ui-monospace, monospace; pointer-events: none; text-shadow: 0 1px 2px #000; }
  aside { width: 400px; background: #232228; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid #111; }
  .tabs { display: flex; }
  .tabs button { flex: 1; border-radius: 0; border: 0; padding: 8px; background: #1a191e; color: #999; }
  .tabs button.on { background: #232228; color: #e8c878; font-weight: 600; }
  .panel { flex: 1; overflow: auto; padding: 4px 12px 20px; }
  .panel a { color: #e8c878; }
  .sec { color: #e8c878; margin: 16px 0 6px; font-weight: 600; border-bottom: 1px solid #36353d; padding-bottom: 2px; }
  .row { display: grid; grid-template-columns: 76px 1fr 64px; gap: 6px; align-items: center; margin: 3px 0; }
  .row input[type=range] { width: 100%; }
  .row input[type=color] { width: 44px; height: 22px; padding: 0; border: 1px solid #444; background: none; }
  .val { font: 12px ui-monospace, monospace; color: #aaa; text-align: right; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; }
  table.kv td { padding: 1px 0; vertical-align: top; }
  table.kv td:first-child { color: #888; padding-right: 10px; white-space: nowrap; width: 76px; }
  table.parts { font: 12px ui-monospace, monospace; }
  table.parts th { text-align: left; color: #888; font-weight: normal; position: sticky; top: 0; background: #232228; }
  table.parts td { padding: 1px 4px 1px 0; white-space: nowrap; }
  table.parts tr.p { cursor: pointer; }
  table.parts tr.p:hover { background: #2e2d35; }
  table.parts tr.sel { background: #4a3f20; }
  .sw { display: inline-block; width: 13px; height: 13px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1px solid #0008; }
  .point { background: #2a2930; border-radius: 4px; padding: 6px 8px; margin: 6px 0; }
  .phead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
  button { background: #34333b; color: #ddd; border: 1px solid #45444d; border-radius: 4px; padding: 3px 9px; cursor: pointer; font: inherit; }
  button:hover { background: #3f3e47; }
  select { font: inherit; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; align-items: center; }
  .note { color: #888; font-size: 12px; }
  textarea { width: 100%; height: 160px; background: #16151a; color: #bbb; border: 1px solid #333; font: 11px ui-monospace, monospace; }
  img.ref { width: 100%; border-radius: 4px; background: #111; display: block; margin-top: 8px; }
  .detail { font: 12px ui-monospace, monospace; color: #ccc; white-space: pre-wrap; background: #1a191e; padding: 6px 8px; border-radius: 4px; min-height: 2em; }
  .parts-wrap { max-height: 320px; overflow: auto; border: 1px solid #2e2d35; border-radius: 4px; }
</style></head>
<body>
<header>
  <a href="./">← 例子</a>
  <b id="title"></b>
  <label>镜头 <select id="view"></select></label>
  <label><input type="checkbox" id="tex" checked> 贴图</label>
  <label>拆开 <input type="range" id="apart" min="0" max="1" step="0.01" value="0"></label>
  <span id="actions" class="btns"></span>
  <label><input type="checkbox" id="spin"> 转</label>
  <span class="hint">拖画面转 · 滚轮缩放 · 点物体选部件 · 双击复位</span>
</header>
<main>
  <div id="stage"><div id="picked"></div></div>
  <aside>
    <div class="tabs"><button id="tabInfo" class="on">信息</button><button id="tabLight">光照</button></div>
    <div class="panel" id="info"></div>
    <div class="panel" id="light" hidden></div>
  </aside>
</main>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
<script type="module" src="./item.ts"></script>
</body></html>
